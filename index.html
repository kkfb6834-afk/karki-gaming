<<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KARKI GAMING</title>
<style>
body {
  margin:0;
  background:#101f18;
  color:white;
  text-align:center;
  font-family:Arial;
}
h1 {color:gold;}
canvas {
  width:95%;
  max-width:700px;
  background:skyblue;
  border:4px solid white;
  touch-action:none;
}
button {
  padding:16px;
  margin:8px;
  font-size:25px;
  border-radius:10px;
}
</style>
</head>
<body>

<h1>🎮 KARKI GAMING</h1>
<h3 id="score">Level: 1 | Coins: 0</h3>

<canvas id="game" width="700" height="340"></canvas>

<div>
<button ontouchstart="left=true" ontouchend="left=false"
onmousedown="left=true" onmouseup="left=false">⬅️</button>

<button onclick="jump()">⬆️</button>

<button ontouchstart="right=true" ontouchend="right=false"
onmousedown="right=true" onmouseup="right=false">➡️</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

let player={x:30,y:270,w:25,h:35,vy:0};
let left=false,right=false;
let coins=0,level=1;
let enemy={x:400,y:275,v:2};
let collected=[];

function makeCoins(){
 collected=[];
 for(let i=0;i<20;i++){
 collected.push({
 x:80+(i%10)*60,
 y:180-Math.floor(i/10)*65,
 got:false
 });
 }
}
makeCoins();

function jump(){
 if(player.y>=269) player.vy=-11;
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")left=true;
 if(e.key==="ArrowRight")right=true;
 if(e.key==="ArrowUp")jump();
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")left=false;
 if(e.key==="ArrowRight")right=false;
});

function draw(){
 ctx.clearRect(0,0,700,340);

 ctx.fillStyle="green";
 ctx.fillRect(0,295,700,45);

 if(left)player.x-=4;
 if(right)player.x+=4;

 player.vy+=0.5;
 player.y+=player.vy;

 if(player.y>260){
 player.y=260;
 player.vy=0;
 }

 player.x=Math.max(0,Math.min(675,player.x));

 ctx.fillStyle="red";
 ctx.fillRect(player.x,player.y,player.w,player.h);

 collected.forEach(o=>{
 if(!o.got){
 ctx.fillStyle="gold";
 ctx.beginPath();
 ctx.arc(o.x,o.y,9,0,Math.PI*2);
 ctx.fill();

 if(Math.abs(player.x-o.x)<25 &&
 Math.abs(player.y-o.y)<25){
 o.got=true;
 coins++;
 }
 }
 });

 enemy.x+=enemy.v;
 if(enemy.x>650||enemy.x<300)enemy.v*=-1;

 ctx.fillStyle="purple";
 ctx.fillRect(enemy.x,270,25,25);

 ctx.fillStyle="yellow";
 ctx.fillRect(660,260,15,40);

 if(player.x>645){
 level++;
 player.x=20;
 makeCoins();
 }

 document.getElementById("score").innerText=
 "Level: "+level+" | Coins: "+coins;

 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>>
