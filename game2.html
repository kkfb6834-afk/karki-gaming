
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARKI GAMING 3.0</title>
<style>
body{
 margin:0;background:#101827;color:white;
 text-align:center;font-family:Arial;
}
h1{color:#ffd43b}
canvas{
 width:96%;max-width:800px;
 border:3px solid white;border-radius:12px;
 touch-action:none;
}
button{
 padding:14px;margin:5px;border:0;
 border-radius:12px;background:#315b86;
 color:white;font-size:22px;
}
#controls{
 display:grid;grid-template-columns:70px 70px 70px;
 justify-content:center;
}
#up{grid-column:2}
#left{grid-column:1}
#right{grid-column:3}
#down{grid-column:2}
#restart{background:#15965b}
</style>
</head>
<body>

<h1>⭐ KARKI GAMING ⭐</h1>
<h3 id="score">Level: 1 | Coins: 0</h3>

<canvas id="game" width="800" height="450"></canvas>

<h3 id="msg">Collect coins and reach EXIT!</h3>

<div id="controls">
<button id="up" data-key="up">⬆️</button>
<button id="left" data-key="left">⬅️</button>
<button id="right" data-key="right">➡️</button>
<button id="down" data-key="down">⬇️</button>
</div>

<button id="restart">🔄 Restart</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let level=1,coins=0,total=0;
let player={x:35,y:35,w:24,h:24};
let keys={};
let coinList=[],walls=[],enemies=[];
let won=false;

const themes=[
 "#72b95e","#398bc0","#a56a42",
 "#55b6ad","#694c9c"
];

function setup(){
 coins=0;won=false;
 player.x=35;player.y=35;
 coinList=[];walls=[];enemies=[];

 total=5+level;

 for(let i=0;i<total;i++){
  coinList.push({
   x:100+(i*113)%630,
   y:85+(i*71)%285,
   taken:false
  });
 }

 walls=[
  {x:170,y:100,w:65,h:65},
  {x:350,y:180,w:75,h:45},
  {x:540,y:80,w:55,h:70},
  {x:190,y:310,w:75,h:40}
 ];

 if(level>=2){
  walls.push({x:440,y:330,w:90,h:35});
 }

 if(level>=3){
  walls.push({x:620,y:200,w:45,h:75});
 }

 enemies=[
  {x:300,y:270,min:260,max:470,s:75,d:1}
 ];

 if(level>=2){
  enemies.push({x:560,y:130,min:500,max:690,s:90,d:1});
 }

 if(level>=4){
  enemies.push({x:390,y:370,min:300,max:550,s:110,d:1});
 }

 document.getElementById("msg").textContent=
 "Level "+level+" - Collect every coin!";
}

function blocked(x,y){
 if(x<5||y<5||x+24>795||y+24>445)return true;

 return walls.some(w=>
 x+24>w.x&&x<w.x+w.w&&
 y+24>w.y&&y<w.y+w.h
 );
}

function update(dt){
 if(won)return;

 let dx=0,dy=0;
 if(keys.left)dx=-1;
 if(keys.right)dx=1;
 if(keys.up)dy=-1;
 if(keys.down)dy=1;

 let speed=190;
 let nx=player.x+dx*speed*dt;
 let ny=player.y+dy*speed*dt;

 if(!blocked(nx,player.y))player.x=nx;
 if(!blocked(player.x,ny))player.y=ny;

 coinList.forEach(c=>{
  if(!c.taken&&Math.hypot(
  player.x+12-c.x,player.y+12-c.y)<22){
   c.taken=true;
   coins++;
  }
 });

 enemies.forEach(e=>{
  e.x+=e.s*e.d*dt;
  if(e.x<e.min||e.x>e.max)e.d*=-1;

  if(Math.hypot(
  player.x+12-e.x,
  player.y+12-e.y)<25){
   player.x=35;
   player.y=35;
   document.getElementById("msg").textContent=
   "Oops! Try again!";
  }
 });

 if(coins===total&&player.x>720&&player.y>350){
  if(level<5){
   level++;
   setup();
  }else{
   won=true;
   document.getElementById("msg").textContent=
   "🏆 CONGRATULATIONS! KARKI GAMING WON!";
  }
 }

 document.getElementById("score").textContent=
 "Level: "+level+" | Coins: "+coins+"/"+total;
}

function draw(){
 ctx.fillStyle=themes[level-1];
 ctx.fillRect(0,0,800,450);

 for(let i=0;i<35;i++){
  ctx.fillStyle="rgba(255,255,255,.15)";
  ctx.fillRect(i*73%800,i*47%450,4,4);
 }

 walls.forEach(w=>{
  ctx.fillStyle="#76513b";
  ctx.fillRect(w.x,w.y,w.w,w.h);
 });

 coinList.forEach(c=>{
  if(!c.taken){
   ctx.fillStyle="#ffdf32";
   ctx.beginPath();
   ctx.arc(c.x,c.y,10,0,Math.PI*2);
   ctx.fill();
  }
 });

 enemies.forEach(e=>{
  ctx.fillStyle="#42e0c0";
  ctx.beginPath();
  ctx.arc(e.x,e.y,14,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#123";
  ctx.fillRect(e.x-6,e.y-4,4,4);
  ctx.fillRect(e.x+3,e.y-4,4,4);
 });

 ctx.fillStyle=coins===total?"#13e68a":"#777";
 ctx.fillRect(740,365,35,45);
 ctx.fillStyle="white";
 ctx.font="14px Arial";
 ctx.fillText("EXIT",740,358);

 ctx.fillStyle="#ff4e62";
 ctx.fillRect(player.x,player.y,24,24);
 ctx.fillStyle="white";
 ctx.fillRect(player.x+5,player.y+5,5,5);
 ctx.fillRect(player.x+15,player.y+5,5,5);
}

let last=0;
function loop(t){
 let dt=Math.min((t-last)/1000||0,0.04);
 last=t;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

window.addEventListener("keydown",e=>{
 let k=e.key.toLowerCase();
 if(k.startsWith("arrow"))e.preventDefault();
 if(k==="arrowup"||k==="w")keys.up=true;
 if(k==="arrowdown"||k==="s")keys.down=true;
 if(k==="arrowleft"||k==="a")keys.left=true;
 if(k==="arrowright"||k==="d")keys.right=true;
});

window.addEventListener("keyup",e=>{
 let k=e.key.toLowerCase();
 if(k==="arrowup"||k==="w")keys.up=false;
 if(k==="arrowdown"||k==="s")keys.down=false;
 if(k==="arrowleft"||k==="a")keys.left=false;
 if(k==="arrowright"||k==="d")keys.right=false;
});

document.querySelectorAll("[data-key]").forEach(b=>{
 let k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[k]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  b.addEventListener(ev,()=>keys[k]=false);
 });
});

document.getElementById("restart").onclick=()=>{
 level=1;keys={};setup();
};

setup();
requestAnimationFrame(loop);
</script>
</body>
</html>
